name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # Check out and build soroban-devkit-core since it is not yet on npm
      - name: Checkout soroban-devkit-core
        uses: actions/checkout@v4
        with:
          repository: Raveu-lab/soroban-devkit-core
          path: soroban-devkit-core

      - name: Install and build soroban-devkit-core
        run: |
          cd soroban-devkit-core
          npm install
          npm run build

      - name: Install CLI dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Verify binary
        run: node dist/cli.js --version
