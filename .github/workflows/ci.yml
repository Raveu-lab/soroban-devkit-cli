name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --target cli-builder -t soroban-devkit-cli:ci .

      - name: Verify binary in container
        run: docker run --rm soroban-devkit-cli:ci --version
